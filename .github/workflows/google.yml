name: "Build and Deploy to Google Cloud Run"

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - ".prettierrc"
      - ".prettierignore"
      - "docs/**"
  workflow_dispatch:

env:
  PROJECT_ID: "openclaw-gcp-272026"
  GAR_LOCATION: "asia-southeast3"
  REGION: "asia-southeast3"
  SERVICE_NAME: "a-1990s-style-mom-and-pop-shop"
  REPOSITORY: "a-1990s-style-mom-and-pop-shop"
  IMAGE_NAME: "a-1990s-style-mom-and-pop-shop"
  WORKLOAD_IDENTITY_PROVIDER: "projects/1078213755629/locations/global/workloadIdentityPools/myworktracking/providers/workload-github"

jobs:
  diff-check-and-deploy:
    name: "Setup, Build, Publish, and Deploy to Cloud Run"
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 2

      - name: "Run Incremental Diff Check"
        id: "diff"
        run: |
          node scripts/incremental-deploy.mjs

      # Authenticate to Google Cloud (Auto-detects Service Account Key or Workload Identity Federation)
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          project_id: "${{ env.PROJECT_ID }}"
          credentials_json: "${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS || '' }}"
          workload_identity_provider: "${{ env.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT || '' }}"
          token_format: "access_token"

      # Set up gcloud CLI
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      # Authenticate Docker to Google Artifact Registry
      - name: "Configure Docker for Artifact Registry"
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # Set up Docker Buildx for faster cached builds
      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      # Build and Push Docker container
      - name: "Build and push Docker container"
        uses: "docker/build-push-action@v5"
        with:
          context: "."
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      # Deploy the Docker image to Google Cloud Run
      - name: "Deploy to Google Cloud Run"
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: "${{ env.SERVICE_NAME }}"
          image: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          region: "${{ env.REGION }}"
          flags: "--allow-unauthenticated --port=8080"
