Name: "Build and Deploy to Google Cloud Run"

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  PROJECT_ID: "openclaw-gcp-272026"
  GAR_LOCATION: "asia-southeast3"
  REGION: "asia-southeast3"
  SERVICE_NAME: "a-1990s-style-mom-and-pop-shop"
  REPOSITORY: "a-1990s-style-mom-and-pop-shop"
  IMAGE_NAME: "a-1990s-style-mom-and-pop-shop"
  WORKLOAD_PROVIDER: ${{ secrets.GCP_WORKLOAD_PROVIDER }}

jobs:
  build-and-deploy:
    name: "Setup, Build, Publish, and Deploy to Cloud Run"
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v4"

      # 1. Authenticate to Google Cloud (แก้ไขชื่อตัวแปรให้ตรงกับ env)
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ env.WORKLOAD_PROVIDER }}"

      # 2. Authenticate Docker to Google Artifact Registry (ใช้ action ทางการของ GCP)
      - name: "Docker Auth"
        uses: "google-github-actions/docker-auth@v2"
        with:
          registry: "${{ env.GAR_LOCATION }}-docker.pkg.dev"

      # 3. Build and Push Docker container
      - name: "Build and push Docker container"
        run: |-
          IMAGE_TAG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_LATEST="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:latest"

          docker build \
            --tag "${IMAGE_TAG}" \
            --tag "${IMAGE_LATEST}" \
            .

          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_LATEST}"

      # 4. Deploy the Docker image to Google Cloud Run
      - name: "Deploy to Google Cloud Run"
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: "${{ env.SERVICE_NAME }}"
          image: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          region: "${{ env.REGION }}"
          flags: "--allow-unauthenticated --port=8080"
