name: "Build and Deploy to Google Cloud Run (Incremental)"

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - ".prettierrc"
      - ".prettierignore"
      - "docs/**"
  workflow_dispatch:

env:
  PROJECT_ID: "my-project-id" # TODO: update to your Google Cloud project ID
  GAR_LOCATION: "asia-east1" # Region for Artifact Registry (e.g., asia-east1, us-central1)
  REGION: "asia-east1" # Region for Cloud Run service
  SERVICE_NAME: "inventory-app" # Name of the Cloud Run service
  REPOSITORY: "cloud-run-source-deploy" # Artifact Registry repository name
  IMAGE_NAME: "inventory-app"
  WORKLOAD_IDENTITY_PROVIDER: "projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider" # TODO: update if using Workload Identity Federation

jobs:
  diff-check-and-deploy:
    name: "Selective Delta Build & Deploy to Cloud Run"
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 2

      - name: "Run Incremental Diff Check"
        id: "diff"
        run: |
          node scripts/incremental-deploy.mjs

      # Authenticate to Google Cloud
      # Option A: Workload Identity Federation (recommended)
      # Option B: Service Account Key via secrets.GCP_SA_KEY (with credentials_json: '${{ secrets.GCP_SA_KEY }}')
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ env.WORKLOAD_IDENTITY_PROVIDER }}"

      # Authenticate Docker to Google Artifact Registry
      - name: "Docker Auth"
        uses: "docker/login-action@v3"
        with:
          username: "oauth2accesstoken"
          password: "${{ steps.auth.outputs.auth_token }}"
          registry: "${{ env.GAR_LOCATION }}-docker.pkg.dev"

      # Set up Docker Buildx for smart layer caching
      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v3"

      # Build and Push Docker container using registry layer cache
      - name: "Build and push Docker container with Layer Cache"
        uses: "docker/build-push-action@v5"
        with:
          context: "."
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Deploy the Docker image to Google Cloud Run
      - name: "Deploy to Google Cloud Run"
        uses: "google-github-actions/deploy-cloudrun@v2"
        with:
          service: "${{ env.SERVICE_NAME }}"
          image: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          region: "${{ env.REGION }}"
          flags: "--allow-unauthenticated --port=8080"
